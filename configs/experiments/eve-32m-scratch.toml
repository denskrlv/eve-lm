# eve-32m fine-tuned from random weights instead of the pretraining run: the main recipe
# (eve-32m.toml) without pretraining, to measure what pretraining buys. Run it with
# `eve run configs/experiments/eve-32m-scratch.toml`.

[components]
data = "task"
model = "eve"
loss = "joint"
metrics = "joint"
report = "task_scores"
optimizer = "adamw"
schedule = "warmup_cosine"
callbacks = ["train_log", "evaluate", "checkpoint"]

[model]
preset = "eve-32m"  # random weights of this size
tokenizer = "artifacts/tokenizer/eve-16k.json"  # a random model has none of its own

[data]
path = "data/task"

[train]
epochs = 2.0  # steps = epochs * train examples / batch_size
lr = 3e-4
warmup_steps = 200
eval_batches = 10000  # all of val
eval_every = 500
save_every = 500

[run]
out = "artifacts/runs/eve-32m-scratch"

[meta]
task = "questions"
