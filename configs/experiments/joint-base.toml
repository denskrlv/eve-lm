# M8, the joint run, as a full experiment: what `eve finetune --config joint-base` runs.
# Run it with `eve run configs/experiments/joint-base.toml`; swap a component by changing
# its name under [components] (or `--set components.loss=question`).

[components]
data = "task"
model = "eve"
loss = "joint"
metrics = "joint"
report = "task_scores"
optimizer = "adamw"
schedule = "warmup_cosine"
callbacks = ["train_log", "evaluate", "checkpoint"]

[model]
init = "artifacts/runs/base-900m/model.pt"

[data]
path = "data/task"

[report]
values = true

[train]
epochs = 2.0  # steps = epochs * train examples / batch_size
lr = 3e-4
warmup_steps = 200
eval_batches = 10000  # all of val
eval_every = 500
save_every = 500

[run]
out = "artifacts/runs/joint-base"

[meta]
task = "questions"
frozen = false
joint = true
init = "artifacts/runs/base-900m/model.pt"
