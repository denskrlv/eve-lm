[project]
name = "eve"
version = "0.1.0"
description = "A tiny function-calling model with Jev-style question heads"
readme = "README.md"
authors = [
    { name = "Denis Krylov", email = "122829199+denskrlv@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pyarrow>=26.0.0",
    "regex>=2026.9.29",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
]

[project.scripts]
eve = "eve.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-regex>=2026.9.29.20261017",
    "types-tqdm>=4.70.0.20260906",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]
untyped_calls_exclude = ["torch"]  # e.g. Tensor.backward has no annotations

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
